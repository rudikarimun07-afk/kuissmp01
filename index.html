 u["state/phase"]="reveal";

  var a=A[p];if(a.v===undefined||!P[p])return;
  var g=grade(q,a.v),el=Math.max(((a.t||s.qt)-s.qt)/1000,0),pt=g?Math.round(1000*(1-Math.min(el/lim,1)/2)):0;

function grade(q,v){
 if(q.t=="quiz"||q.t=="tf")return v===q.a;
 if(q.t=="type")return parseFloat(String(v).replace(",","."))===q.a;
 if(q.t=="slider")return Math.abs(v-q.a)<=q.tol;
 if(q.t=="puzzle"){v=Array.from(v);return v.length==q.s.length&&v.every(function(x,i){return x===i})}
 if(q.t=="pin")return Math.hypot(v.x-PX(2),v.y-PY(-1))<=22;
 return false}
function qa(q){var h="";
 if(q.t=="quiz"||q.t=="poll")h=q.o.map(function(o,k){return '<button class="opt" onclick="send('+k+')">'+o+"</button>"}).join("");

 if(q.t=="type")h='<input type="text" id="tx" inputmode="decimal" placeholder="Ketik jawabanmu"><button class="btn" onclick="send(tv())">Kirim</button>';
 if(q.t=="cloud")h='<input type="text" id="tx" maxlength="24" placeholder="Satu kata"><button class="btn" onclick="send(tv())">Kirim</button>';
 if(q.t=="brain")h='<p style="color:var(--mut);font-size:14px">'+q.h+'</p><input type="text" id="tx" maxlength="80" placeholder="Tulis idemu"><button class="btn" onclick="send(tv())">Kirim</button>';
 if(q.t=="open")h='<textarea id="tx" rows="4" maxlength="400" placeholder="Tulis jawabanmu"></textarea><button class="btn" onclick="send(tv())">Kirim</button>';
 if(q.t=="slider")h='<div class="big" id="sv">'+q.max/2+'</div><input type="range" id="sl" min="'+q.min+'" max="'+q.max+'" step="0.01" value="'+q.max/2+'" oninput="document.getElementById(\'sv\').textContent=String(this.value).replace(\'.\',\',\')"><button class="btn" onclick="send(parseFloat(document.getElementById(\'sl\').value))">Kunci jawaban</button>';
 if(q.t=="puzzle")h='<ol class="seq" id="seq"></ol><div class="pz" id="pz"></div><button class="btn alt" onclick="pick=[];pzr()">Ulangi</button>';
 if(q.t=="pin")h=pinSvg()+'<p style="color:var(--mut);font-size:14px;margin:8px 0 0">Ketuk gambar untuk menaruh pin. Satu kali saja.</p>';

 if(q.t=="quiz"||q.t=="poll"||q.t=="tf"){(q.t=="tf"?["Benar","Salah"]:q.o).forEach(function(o,k){var val=q.t=="tf"?k==0:k,c=v.filter(function(x){return x===val}).length;h+='<div class="opt'+(q.t!="poll"&&val===q.a?" ok":"")+'">'+o+' <b style="float:right">'+c+"</b></div>"})}
